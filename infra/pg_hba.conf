# LibreJustice — pg_hba.conf
# Monté en :ro via docker-compose ; remplace le pg_hba.conf généré dans PGDATA.
# hba_file = '/etc/postgresql/pg_hba.conf' dans postgresql.conf.

# TYPE  DATABASE    USER        ADDRESS         METHOD

# Connexions Unix locales (healthcheck, psql interne)
local   all         all                         trust

# Connexions réseau localhost
host    all         all         127.0.0.1/32    scram-sha-256
host    all         all         ::1/128         scram-sha-256

# Toutes les autres connexions réseau (y compris hôtes Docker / Podman)
host    all         all         all             scram-sha-256

# Réplication : localhost (pg_rewind local) + réseau (pg_basebackup /
# pg_rewind depuis la machine de dev). Isolation réseau en amont (ADR 0200).
local   replication all                         trust
host    replication all         127.0.0.1/32    trust
host    replication all         ::1/128         trust
host    replication all         all             scram-sha-256
