# LibreJustice — Postgres tuning serveur prod aarch64, 24 Go RAM.
# Validé en P02 (bench dev 32 GiB) ; ajusté ici pour le serveur cible.

# pg_prewarm : son bgworker autoprewarm dumpe périodiquement la liste des
# buffers résidents et les recharge au démarrage. ATTENTION : autoprewarm ne
# couvre QUE shared_buffers — il restaure donc l'index ANN chunks_vec (chargé
# par vchordrq_prewarm dans shared_buffers) mais PAS decisions_bm25, que
# `lj-ingest db prewarm` charge en mode `read` (cache page OS, hors
# shared_buffers car 12 Go > shared_buffers). Après un restart, relancer
# `lj-ingest db prewarm` pour réchauffer le BM25. Cf. working-note 2026-06-01.
shared_preload_libraries = 'pg_search,vchord,pg_cron,pg_stat_statements,pg_prewarm'
pg_stat_statements.track = all

# TOAST : lz4 plutôt que pglz (défaut historique PG). Mesuré sur le corpus
# (corps de décisions) : lz4 ~4× plus rapide en compression, ~1,5× en
# décompression, pour +2,7 % de taille — bon arbitrage CPU↔stockage (ADR 0126).
# S'applique aux valeurs ÉCRITES ensuite ; les colonnes en compression
# « default » suivent ce GUC. full_text (épinglé) passe en lz4 via migration 0083.
default_toast_compression = lz4

# 6 Go (25 % des 24 Go) : tient l'index ANN chunks_vec (5,2 Go) résident dans
# shared_buffers (épinglé par vchordrq_prewarm + restauré par autoprewarm), tout
# en laissant ~18 Go à l'OS/page-cache pour y tenir l'index BM25 chunks_bm25
# (16 Go, chargé en mode `read`). Baissé de 8→6 Go pour rendre ~2 Go de marge
# au pic mémoire des builds d'index / backfills (migrations 0052/0053) ; le
# swap 8 Go sert de filet anti-OOM-kill (cf. /swapfile, vm.swappiness=10).
shared_buffers = 6GB
# Hint planner (pas une allocation) ~83 % RAM : shared_buffers + page-cache OS probable.
effective_cache_size = 20GB
# 4 workers × 4 sous-processus parallèles × 64 MB = 1 Go max — safe sur 24 Go.
work_mem = 64MB
# 512 Mo : NE PAS augmenter. Au-delà, les opérations de maintenance (VACUUM FULL
# hebdo de decision_chunks, REINDEX, build d'index) deviennent nettement plus
# lentes sur cette stack — comportement mesuré, contre-intuitif vs le défaut PG.
maintenance_work_mem = 512MB

# Parallélisme Postgres : 4 sous-processus par gather (BM25, ANN).
# Volontairement inférieur au nb de vCPU pour laisser de la place aux
# requêtes concurrentes des 6 workers Gunicorn.
max_parallel_workers_per_gather = 4

# Connexions : on monte un peu pour le pool psycopg3 (max_size=10 par
# défaut) + sessions de debug.
max_connections = 50

log_min_duration_statement = 250ms
log_line_prefix = '%m [%p] app=%a %q%u@%d '

# Listen sur toutes les interfaces du conteneur ; l'isolation se fait
# par la couche Docker (port 5432 mappé sur 127.0.0.1 par compose).
listen_addresses = '*'

# ── Régime low-IOPS (Hyperdisk throttlé ~10k IOPS, half-duplex) — ADR 0088 ──
# IOPS = ressource rare, CPU abondant (idle ~90 %). On protège le budget IOPS
# de lecture des rafales d'écriture, et on garde le planner sur l'accès indexé.

# Checkpoints rares + flush étalé (checkpoint_completion_target=0.9, défaut) :
# écriture de fond douce au lieu de rafales qui volent l'IOPS aux lectures
# (disque half-duplex). Défaut PG : max_wal_size=1GB / timeout=5min → trop de
# checkpoints sous ingest.
max_wal_size = 8GB
min_wal_size = 2GB
checkpoint_timeout = 30min
# WAL zstd : ÷ le volume WAL (surtout full-page post-checkpoint) → IOPS
# d'écriture rendues aux lectures. Coût CPU ≈ gratuit (idle).
wal_compression = zstd

# SSD + index chauds résidents (chunks_vec en shared_buffers, decisions_bm25 en
# page-cache) : 4 (défaut disque rotatif) sur-pénalise l'index scan et peut
# basculer le planner en seq scan du heap decisions (33 Go) — ruineux en IOPS
# sur disque throttlé. 1.1 garde l'accès indexé (cache hits, ~gratuit).
random_page_cost = 1.1
# NB : effective_io_concurrency reste au défaut PG 18 (16) = optimum fio mesuré
# (~5100 IOPS ; qd64 régresse). Ne pas le RELEVER. Cf. working-note 2026-06-02.

# Sync DB local ↔ serveur via pg_rewind (incrémental) / pg_basebackup (plein).
# Le reste est déjà OK par défaut côté image paradedb : wal_level=replica,
# max_wal_senders=10, data_checksums=on (rend wal_log_hints inutile pour
# pg_rewind), rôle librejustice a déjà REPLICATION, pg_hba autorise
# replication depuis 127.0.0.1.
wal_keep_size = 4GB

# Fichier monté en :ro via docker-compose — remplace le pg_hba.conf dans PGDATA.
# Autorise la réplication depuis toutes les adresses réseau (protégé par le proxy
# `tailscale serve --tcp 5433` tailnet-only + les ACL Tailscale, cf. ADR 0110).
hba_file = '/etc/postgresql/pg_hba.conf'
