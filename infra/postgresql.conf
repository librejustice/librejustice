# LibreJustice — Postgres tuning du serveur de prod (la DB tient entièrement
# en RAM ; NVMe local en RAID1). Cf. runbook 2026-06-25 (migration Kimsufi).

# pg_prewarm : son bgworker autoprewarm dumpe périodiquement la liste des
# buffers résidents et les recharge au démarrage. ATTENTION : autoprewarm ne
# couvre QUE shared_buffers — l'index ANN chunks_vec y est épinglé par
# vchordrq_prewarm ; le BM25 chunks_bm25 peut désormais y tenir aussi
# (shared_buffers=32GB) mais tant que ce n'est pas vérifié, relancer
# `lj-ingest db prewarm` après un restart pour le réchauffer (mode `read`,
# page-cache OS). Cf. working-note 2026-06-01.
shared_preload_libraries = 'pg_search,vchord,pg_cron,pg_stat_statements,pg_prewarm'
pg_stat_statements.track = all

# TOAST : lz4 plutôt que pglz (défaut historique PG). Mesuré sur le corpus
# (corps de décisions) : lz4 ~4× plus rapide en compression, ~1,5× en
# décompression, pour +2,7 % de taille — bon arbitrage CPU↔stockage (ADR 0126).
# S'applique aux valeurs ÉCRITES ensuite ; les colonnes en compression
# « default » suivent ce GUC. full_text (épinglé) passe en lz4 via migration 0083.
default_toast_compression = lz4

# La DB entière tient en RAM : 32 Go de shared_buffers épinglent l'ANN
# chunks_vec + le BM25 chunks_bm25 résidents, le reste de la RAM sert de
# page-cache OS.
shared_buffers = 32GB
# Hint planner (pas une allocation) : shared_buffers + page-cache OS probable.
effective_cache_size = 100GB
# Marge large (max_connections=50).
work_mem = 128MB
# 512 Mo : NE PAS augmenter sans A/B-tester sur UN CREATE INDEX vchord. Au-delà,
# les opérations de maintenance (VACUUM FULL hebdo de decision_chunks, REINDEX,
# build d'index) étaient nettement plus lentes — mesure faite sur l'ancienne
# stack (ARM + disque cloud), possiblement caduque ici, mais ne pas présumer
# que « plus gros = plus rapide » (working-note 2026-06-01).
maintenance_work_mem = 512MB

# Parallélisme Postgres (12 cœurs) : 4 sous-processus par gather (BM25, ANN),
# volontairement inférieur au nb de cœurs pour laisser de la place aux
# requêtes concurrentes de l'app ; pools élargis pour les maintenances
# (REINDEX/VACUUM parallèles) sans affamer les gathers.
max_parallel_workers_per_gather = 4
max_worker_processes = 10
max_parallel_workers = 10
max_parallel_maintenance_workers = 6

# Connexions : pool deadpool de l'app + sessions de debug.
max_connections = 50

log_min_duration_statement = 250ms
log_line_prefix = '%m [%p] app=%a %q%u@%d '

# Listen sur toutes les interfaces du conteneur ; l'isolation se fait
# par la couche Docker (port 5432 mappé sur 127.0.0.1 par compose).
listen_addresses = '*'

# ── Écritures de fond douces (ADR 0088) ──
# Réglages posés sous l'ancien régime low-IOPS, conservés sur NVMe : toujours
# gagnants ou neutres, jamais pénalisants.

# Checkpoints rares + flush étalé (checkpoint_completion_target=0.9, défaut) :
# écriture de fond douce, moins de full-page writes. Défaut PG :
# max_wal_size=1GB / timeout=5min → trop de checkpoints sous ingest.
max_wal_size = 8GB
min_wal_size = 2GB
checkpoint_timeout = 30min
# WAL zstd : ÷ le volume WAL (surtout full-page post-checkpoint). Coût CPU
# ≈ gratuit (idle).
wal_compression = zstd

# NVMe + index chauds résidents : 4 (défaut disque rotatif) sur-pénalise
# l'index scan et peut basculer le planner en seq scan du heap decisions.
# 1.1 garde l'accès indexé (cache hits, ~gratuit).
random_page_cost = 1.1
# NB : effective_io_concurrency reste au défaut PG 18 (16).

# Sync DB local ↔ serveur via pg_rewind (incrémental) / pg_basebackup (plein).
# Le reste est déjà OK par défaut côté image paradedb : wal_level=replica,
# max_wal_senders=10, data_checksums=on (rend wal_log_hints inutile pour
# pg_rewind), rôle librejustice a déjà REPLICATION, pg_hba autorise
# replication depuis 127.0.0.1.
wal_keep_size = 4GB

# Fichier monté en :ro via docker-compose — remplace le pg_hba.conf dans PGDATA.
# L'isolation réseau est assurée en amont (ADR 0200).
hba_file = '/etc/postgresql/pg_hba.conf'
