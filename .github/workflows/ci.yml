name: CI

on:
  workflow_dispatch:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-
      # rust-toolchain.toml pin la toolchain (nightly + rustfmt/clippy) ; rustup
      # l'installe à la 1re invocation cargo. `mise run test` = lint (rustfmt
      # --check + clippy -D warnings) + cargo test --workspace.
      - run: mise run test
